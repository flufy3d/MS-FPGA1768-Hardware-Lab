; Host profile of projects/07_dma (fpga1768, see host/README.md).
; Source of every value: projects/07_dma/README.md (register map), dma_port.sv
; and dma_pkg.sv. Keep in sync with the RTL.

[profile]
name        = 07_dma
project     = projects/07_dma
description = PCIe Gen3 x8 DMA throughput test: own descriptor engine, pattern generator/checker, 4 MB RAM
shell_id    = 0x444D4137        ; "DMA7"
caps        = 0x00000010        ; bit4 DMA
caps2       = 0x00000000        ; reserved

[regs]
; minimal contract (identical in every profile)
shell_id        = 0x0000
caps            = 0x0004
caps2           = 0x0008
; common registers
port_index      = 0x000C        ; hard IP served by this BAR0 (0 = PCIe #1)
scratch         = 0x0010
counter         = 0x0030        ; core clock (250 MHz) cycle counter [31:0]
id              = 0x0040        ; 0x50434945, checked by the Windows driver
temp            = 0x0050        ; die temperature sensor
; DMA engine (dma_port.sv)
dma_version     = 0x0060
dma_clk_hz      = 0x0064
dma_ram_bytes   = 0x0068
dma_chunk_shift = 0x006C        ; log2 of the host chunk size (22 = 4 MB)
dma_chunk_count = 0x0070        ; chunk table entries
dma_time_lo     = 0x0074        ; 64-bit cycle counter, LO read latches HI at +4
dma_ctrl        = 0x0080        ; W: [0] start H2D [1] start D2H [4] abort [8] clear checker
dma_status      = 0x0084        ; [0] H2D busy [1] D2H busy [2]/[3] done [4]/[5] aborted
dma_seed        = 0x0088        ; pattern seed
dma_pat_base_hi = 0x008C        ; reads 1: pattern window at 0x1_0000_0000
dma_h2d         = 0x0100        ; H2D (read DMA) block
dma_d2h         = 0x0180        ; D2H (write DMA) block
dma_chk         = 0x0200        ; pattern checker block
dma_chunk_table = 0x1000        ; entry i at +8*i: LO, then HI (commits)

[dma]
version         = 0x00070001    ; VERSION register of this build
pat_base_hi     = 0x00000001    ; pattern window = pat_base_hi << 32
; offsets inside the H2D / D2H blocks (64-bit values: LO here, HI at +4)
fpga_lo         = 0x00
fpga_hi         = 0x04
length          = 0x08
chunk0          = 0x0C
desc_shift      = 0x10
loops           = 0x14
max_out         = 0x18
seq             = 0x1C
stat_lo         = 0x20
stat_hi         = 0x24
issued          = 0x40
done            = 0x44
err             = 0x48
state           = 0x4C          ; [0] busy [1] done [2] aborted
t_first         = 0x50
t_last          = 0x58
d_first         = 0x60
d_last          = 0x68
beats           = 0x70
cycles          = 0x78
; offsets inside the checker block
chk_err         = 0x00
chk_addr        = 0x04
chk_exp         = 0x0C
chk_got         = 0x10
chk_beats       = 0x14
