; Host profile of projects/05_ddr4 (fpga1768, see host/README.md).
; Source of every value: projects/05_ddr4/README.md (register map) and
; make_qsys.tcl / ddr4_top.sv / shell_regs.sv. Keep in sync with the RTL.

[profile]
name        = 05_ddr4
project     = projects/05_ddr4
description = PCIe Gen3 x8, 2 x DDR4-2133 72 bit, PR personas, read-only flash window
shell_id    = 0x53480501        ; "SH", project 05, v1
caps        = 0x0000000D        ; bit0 DDR4 | bit2 PR | bit3 flash window (bit1 I2C absent)
caps2       = 0x00000000        ; reserved

[regs]
; minimal contract (identical in every profile)
shell_id        = 0x0000
caps            = 0x0004
caps2           = 0x0008
; common registers
counter         = 0x0030        ; free-running 100 MHz counter
id              = 0x0040        ; 0x50434945, checked by the Windows driver
temp            = 0x0050        ; die temperature sensor
persona         = 0x0060        ; [15:0] persona ID, [16] freeze, [17] reset, [18] PR PLL locked
; PR controller (alt_pr)
pr_data         = 0x0100
pr_csr          = 0x0104
pr_version      = 0x0108
pr_id           = 0x010C
; shell registers (BAR0 + 0x200, shell_regs.sv)
ddr_status      = 0x0200
ddr_quiesce     = 0x0204
flash_page      = 0x0208
ddr_mbox_ctrl   = 0x020C
ddr_mbox_addr   = 0x0210
ddr_mbox_go     = 0x0214
ddr_mbox_status = 0x0218
ddr_info        = 0x021C
ddr_mbox_wdata  = 0x0220        ; 18 words
ddr_mbox_rdata  = 0x0280        ; 18 words
regs_version    = 0x02F0
; windows
persona_win     = 0x1000        ; 4 KB, defined by the loaded persona
flash_win       = 0x4000        ; 16 KB, read only, page = flash_page
scratch_ram     = 0x8000        ; 32 KB

[pr]
version         = 0xAA500003    ; alt_pr CSR_VERSION, Quartus Prime Pro 25.1

[ddr]
word_bytes      = 72            ; 576-bit EMIF user word, ECC off
last_word       = 0x1FFFFFF     ; 2^25 words per channel
user_clock_hz   = 266666667     ; quarter rate of 1066.667 MHz
info_value      = 0x08551948    ; expected DDR_INFO

[flash]
window_bytes    = 0x4000
size_mb         = 128           ; N25Q00AA, 1 Gb
