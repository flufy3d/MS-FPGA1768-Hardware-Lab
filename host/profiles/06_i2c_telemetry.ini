; Host profile of projects/06_i2c_telemetry (fpga1768, see host/README.md).
; Source of every value: projects/06_i2c_telemetry/README.md (register map),
; bar0_regs.sv, i2c_master.sv and i2c_telemetry.sv. Keep in sync with the RTL.

[profile]
name        = 06_i2c_telemetry
project     = projects/06_i2c_telemetry
description = PCIe Gen3 x8, I2C master for board buses 1 and 2, PR with A + B / A - B personas
shell_id    = 0x49323036        ; "I206"
caps        = 0x00000006        ; bit1 I2C | bit2 PR
caps2       = 0x00000000        ; reserved

[regs]
; minimal contract (identical in every profile)
shell_id        = 0x0000
caps            = 0x0004
caps2           = 0x0008
; common registers
counter         = 0x0030        ; free-running 100 MHz counter
id              = 0x0040        ; 0x50434945, checked by the Windows driver
temp            = 0x0050        ; die temperature sensor
; I2C master (bar0_regs.sv)
i2c_ctrl        = 0x0060        ; [0] start [1] bus 2 [2] read [3] abort [4] no command byte
i2c_addr        = 0x0064        ; [6:0]
i2c_page        = 0x0068        ; [7:0] page, [8] enable (writes register 0xFF first)
i2c_reg         = 0x006C        ; command byte
i2c_len         = 0x0070        ; data bytes 0..28
i2c_data        = 0x0074        ; 28 bytes, little endian, up to 0x008F
i2c_status      = 0x0090        ; [0] busy [1] NACK [2] done [3] timeout [4] aborted
                                ; [15:8] bytes, [19:16] SDA2 SCL2 SDA1 SCL1
i2c_div         = 0x0094        ; quarter SCL period in clk cycles (250 = 100 kHz)
; persona ABI (same fields as project 04, at other offsets)
persona         = 0x00A0        ; [15:0] persona ID, [16] freeze, [17] reset, [18] PR PLL locked
; PR controller (alt_pr), as in projects 04 and 05
pr_data         = 0x0100
pr_csr          = 0x0104
pr_version      = 0x0108
pr_id           = 0x010C
; windows
scratch_ram     = 0x8000        ; 32 KB

[persona]
; A + B persona test (persona 1 = A + B, persona 2 = A - B), `fpga1768 persona`
a               = 0x00A4
b               = 0x00A8
sum             = 0x00AC

[pr]
version         = 0xAA500003    ; alt_pr CSR_VERSION, Quartus Prime Pro 25.1

[i2c]
max_len         = 28
clk_hz          = 100000000     ; clk_100
sensor_bus      = 2             ; docs/hardware/i2c.md: management bus
tmp411          = 0x4C          ; U18 TMP411
lm25066         = 0x42          ; U13 LM25066
; Devices whose register 0xFF is a page select that `i2c preg` may write.
; 0x22 = U17 DS250DF810 retimer (0xFF = register page select, datasheet
; Table 11). Never add the VR controller (0x40) or the hot-swap controller.
preg_allow      = 0x22
